[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "quilr-assessment"
version = "0.1.0"
description = "MCP and LLM gateway assessment exercises"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.1.1",
    "pydantic>=2.13.5,<3",
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.4,<1",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16.6,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quilr_assessment"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.env.example",
    "/.gitignore",
]
exclude = ["*.pdf", "/local_reference"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: local subprocess or HTTP integration checks; no external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
